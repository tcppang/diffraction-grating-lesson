<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diffraction Grating Lesson | HKDSE Physics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#17202A}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #1D4ED8;outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
input[type=range]{width:100%;margin:0;height:28px;accent-color:#1D4ED8}
a{color:#1D4ED8}
.lab-body{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.lab-controls{width:330px;flex:0 0 330px}
.lab-main{flex:1 1 640px;min-width:0}
@media (max-width:1060px){
.lab-controls{width:100%;flex:1 1 100%;flex-direction:row !important;flex-wrap:wrap;align-items:flex-start}
.lab-controls>*{flex:1 1 260px}
.lab-controls>.lab-title{flex-basis:100%}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="box-sizing:border-box;width:100%;background:#EEF0EC;padding:24px 16px 48px;display:flex;justify-content:center">
<div style="width:100%;max-width:1040px;display:flex;flex-direction:column;gap:20px">

<!-- Header -->
<div style="background:#17202A;color:#fff;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#C9D1DC">HKDSE Physics · Wave Motion</div>
<h1 style="margin:0;font-size:34px;line-height:1.1;font-weight:600">Diffraction Grating: learn it, then prove it</h1>
<button onClick="{{goSim}}" style="align-self:flex-start;min-height:44px;padding:0;border:none;background:transparent;color:#FFFFFF;font-size:14px;font-weight:500;text-decoration:underline">Open the full interference lab (double slit and grating)</button>
</div>
<div style="display:flex;gap:8px">
<button onClick="{{goLesson}}" aria-pressed="{{isLesson}}" style="{{tabLesson}}">Lesson</button>
<button onClick="{{goSim}}" aria-pressed="{{isSim}}" style="{{tabSim}}">Simulation</button>
<button onClick="{{goPractice}}" aria-pressed="{{isPractice}}" style="{{tabPractice}}">Practice</button>
</div>
</div>
<sc-if value="{{isLesson}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;gap:8px;flex-wrap:wrap">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button onClick="{{c.go}}" disabled="{{c.locked}}" style="{{c.st}}">{{c.t}}</button>
</sc-for>
</div>
</sc-if>
</div>

<!-- SIMULATION: double slit and grating -->
<sc-if value="{{isSim}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:20px">
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#4B5563">Simulation</div>
<h2 style="margin:0;font-size:28px;font-weight:600">Double slit and diffraction grating lab</h2>
<div style="font-size:16px;line-height:1.5">Pick an experiment, then change one slider at a time and watch the pattern.</div>
</div>
<div style="display:flex;gap:8px">
<button onClick="{{L_setSlit}}" aria-pressed="{{L_isSlit}}" style="{{L_tabSlit}}">Double slit</button>
<button onClick="{{L_setGrating}}" aria-pressed="{{L_isGrating}}" style="{{L_tabGrating}}">Diffraction grating</button>
</div>
</div>
<div class="lab-body">

<!-- Controls -->
<div class="lab-controls" style="box-sizing:border-box;background:#fff;border:1px solid #D5D9D2;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:22px">
<div class="lab-title" style="font-size:18px;font-weight:600">Controls</div>

<div style="display:flex;flex-direction:column;gap:4px">
<div style="display:flex;justify-content:space-between;align-items:baseline">
<label for="lam" style="font-size:15px;font-weight:500">Wavelength λ</label>
<span style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500">{{L_lamLabel}}</span>
</div>
<div style="height:10px;border-radius:5px;background:{{L_lamSwatch}}"></div>
<input id="lam" type="range" min="400" max="700" step="1" value="{{L_lambda}}" onInput="{{L_onLambda}}" onChange="{{L_onLambda}}">
<div style="display:flex;gap:8px">
<button onClick="{{L_setViolet}}" style="flex:1;min-height:44px;border:1px solid #D5D9D2;background:#fff;border-radius:8px;font-size:13px;color:#17202A">Violet<br>405 nm</button>
<button onClick="{{L_setGreen}}" style="flex:1;min-height:44px;border:1px solid #D5D9D2;background:#fff;border-radius:8px;font-size:13px;color:#17202A">Green<br>532 nm</button>
<button onClick="{{L_setRed}}" style="flex:1;min-height:44px;border:1px solid #D5D9D2;background:#fff;border-radius:8px;font-size:13px;color:#17202A">Red<br>650 nm</button>
</div>
</div>

<sc-if value="{{L_isSlit}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:4px">
<div style="display:flex;justify-content:space-between;align-items:baseline">
<label for="sep" style="font-size:15px;font-weight:500">Slit separation a</label>
<span style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500">{{L_aLabel}}</span>
</div>
<input id="sep" type="range" min="0.2" max="1" step="0.05" value="{{L_a}}" onInput="{{L_onA}}" onChange="{{L_onA}}">
</div>
</sc-if>

<sc-if value="{{L_isGrating}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:22px">
<div style="display:flex;flex-direction:column;gap:4px">
<div style="display:flex;justify-content:space-between;align-items:baseline">
<label for="lines" style="font-size:15px;font-weight:500">Lines per mm</label>
<span style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500">{{L_linesLabel}}</span>
</div>
<input id="lines" type="range" min="100" max="600" step="20" value="{{L_lines}}" onInput="{{L_onLines}}" onChange="{{L_onLines}}">
</div>
<div style="display:flex;flex-direction:column;gap:4px">
<div style="display:flex;justify-content:space-between;align-items:baseline">
<label for="nslit" style="font-size:15px;font-weight:500">Number of slits lit, N</label>
<span style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500">{{L_NLabel}}</span>
</div>
<input id="nslit" type="range" min="2" max="20" step="1" value="{{L_N}}" onInput="{{L_onN}}" onChange="{{L_onN}}">
<div style="font-size:13px;line-height:1.4;color:#4B5563">A real grating has thousands of slits, so its spots are much sharper than shown here.</div>
</div>
</div>
</sc-if>

<div style="display:flex;flex-direction:column;gap:4px">
<div style="display:flex;justify-content:space-between;align-items:baseline">
<label for="dist" style="font-size:15px;font-weight:500">Screen distance D</label>
<span style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500">{{L_DLabel}}</span>
</div>
<input id="dist" type="range" min="0.5" max="3" step="0.1" value="{{L_D}}" onInput="{{L_onD}}" onChange="{{L_onD}}">
</div>

<button onClick="{{L_reset}}" style="min-height:44px;border:1px solid #17202A;background:#fff;border-radius:8px;font-size:15px;font-weight:500;color:#17202A">Reset this mode</button>
</div>

<!-- Main column -->
<div class="lab-main" style="display:flex;flex-direction:column;gap:24px">

<!-- Top view -->
<div style="background:#fff;border:1px solid #D5D9D2;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;justify-content:space-between;align-items:baseline">
<div style="font-size:18px;font-weight:600">Top view: where the bright spots form</div>
<div style="font-size:13px;color:#4B5563">{{L_viewNote}}</div>
</div>
<div style="display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap">

<div style="position:relative;width:560px;height:450px;flex-shrink:0;border-radius:8px;overflow:hidden;background:#0B1220">
<div style="position:absolute;left:14px;top:10px;font-size:13px;color:#C9D1DC">Incident light, wavelength λ</div>
<sc-for list="{{L_wavefronts}}" as="wf" hint-placeholder-count="3">
<div style="{{wf.st}}"></div>
</sc-for>

<sc-for list="{{L_rays}}" as="r" hint-placeholder-count="7">
<div style="{{r.st}}"></div>
</sc-for>

<div style="position:absolute;left:66px;top:0;width:8px;height:450px;background:#6B7686"></div>
<sc-if value="{{L_isSlit}}" hint-placeholder-val="{{ true }}">
<div>
<div style="{{L_gapUp}}"></div>
<div style="{{L_gapDown}}"></div>
<div style="position:absolute;left:80px;top:{{L_aLabelTop}}px;font-size:14px;font-weight:600;color:#fff">a</div>
</div>
</sc-if>
<sc-if value="{{L_isGrating}}" hint-placeholder-val="{{ false }}">
<div>
<div style="{{L_gratingStyle}}"></div>
<div style="position:absolute;left:80px;top:215px;font-size:14px;font-weight:600;color:#fff">d</div>
</div>
</sc-if>

<div style="position:absolute;left:{{L_screenLeft}}px;top:30px;width:6px;height:390px;background:#9AA3B0"></div>
<div style="position:absolute;left:{{L_screenLabelLeft}}px;top:10px;font-size:13px;color:#C9D1DC">Screen</div>

<sc-for list="{{L_dots}}" as="d" hint-placeholder-count="7">
<div style="{{d.st}}"></div>
</sc-for>
<sc-for list="{{L_dotLabels}}" as="dl" hint-placeholder-count="7">
<div style="{{dl.st}}">{{dl.t}}</div>
</sc-for>

<div style="position:absolute;left:{{L_thetaLeft}}px;top:{{L_thetaTop}}px;font-size:15px;font-weight:600;color:#fff">θ</div>

<div style="position:absolute;left:70px;top:416px;width:{{L_HxPx}}px;text-align:center;font-size:13px;color:#C9D1DC">{{L_DLabel}}</div>
<div style="position:absolute;left:70px;top:436px;width:{{L_HxPx}}px;height:1px;background:#C9D1DC"></div>
<div style="position:absolute;left:70px;top:431px;width:1px;height:11px;background:#C9D1DC"></div>
<div style="position:absolute;left:{{L_screenLeft}}px;top:431px;width:1px;height:11px;background:#C9D1DC"></div>
</div>

<div style="flex:1 1 220px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;flex-direction:column;gap:8px">
<div style="font-size:14px;font-weight:500;color:#4B5563">Highlight bright order</div>
<div style="display:flex;align-items:center;gap:10px">
<button onClick="{{L_prevOrder}}" disabled="{{L_prevDisabled}}" aria-label="Previous order" style="width:44px;height:44px;border:1px solid #17202A;background:#fff;border-radius:8px;font-size:20px;color:#17202A">−</button>
<div style="flex-grow:1;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500">n = {{L_order}}</div>
<button onClick="{{L_nextOrder}}" disabled="{{L_nextDisabled}}" aria-label="Next order" style="width:44px;height:44px;border:1px solid #17202A;background:#fff;border-radius:8px;font-size:20px;color:#17202A">+</button>
</div>
</div>
<div style="display:flex;flex-direction:column;border-top:1px solid #D5D9D2">
<sc-for list="{{L_readout}}" as="ro" hint-placeholder-count="5">
<div style="display:flex;flex-direction:column;gap:2px;padding:9px 0;border-bottom:1px solid #D5D9D2">
<div style="font-size:13px;color:#4B5563">{{ro.k}}</div>
<div style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500">{{ro.v}}</div>
</div>
</sc-for>
</div>
</div>

</div>
</div>

<!-- Screen view -->
<div style="background:#fff;border:1px solid #D5D9D2;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;justify-content:space-between;align-items:baseline">
<div style="font-size:18px;font-weight:600">What you see on the screen</div>
<div style="font-size:13px;color:#4B5563">Screen width shown: ±{{L_halfLabel}}</div>
</div>
<div style="display:flex;height:84px;background:#000;border-radius:6px;overflow:hidden">
<sc-for list="{{L_strips}}" as="s" hint-placeholder-count="30">
<div style="{{s.st}}"></div>
</sc-for>
</div>
<div style="position:relative;height:50px">
<sc-for list="{{L_marks}}" as="m" hint-placeholder-count="7">
<div style="{{m.st}}">{{m.t}}</div>
</sc-for>
</div>
<div style="font-size:13px;font-weight:500;color:#4B5563">Relative intensity</div>
<div style="display:flex;align-items:flex-end;height:90px;border-bottom:1px solid #17202A;background:#F7F8F6">
<sc-for list="{{L_bars}}" as="b" hint-placeholder-count="30">
<div style="{{b.st}}"></div>
</sc-for>
</div>
</div>

<!-- Working + practice -->
<div style="display:flex;gap:24px;align-items:stretch;flex-wrap:wrap">
<div style="flex:1 1 380px;min-width:0;box-sizing:border-box;background:#17202A;color:#fff;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px">
<div style="font-size:14px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#C9D1DC">Live working</div>
<div style="font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:500">{{L_formulaMain}}</div>
<div style="font-size:14px;line-height:1.5;color:#E5E9EF">{{L_formulaNote}}</div>
<div style="display:flex;flex-direction:column;gap:8px;border-top:1px solid #4B5563;padding-top:14px">
<sc-for list="{{L_steps}}" as="st" hint-placeholder-count="5">
<div style="font-family:'IBM Plex Mono',monospace;font-size:14px;line-height:1.45">{{st.t}}</div>
</sc-for>
</div>
</div>
<div style="flex:1 1 300px;display:flex;flex-direction:column;gap:24px">
<div style="background:#fff;border:1px solid #D5D9D2;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px">
<div style="font-size:18px;font-weight:600">Predict, then test</div>
<sc-for list="{{L_tasks}}" as="tk" hint-placeholder-count="4">
<div style="font-size:14px;line-height:1.45">{{tk.t}}</div>
</sc-for>
</div>
<div style="background:#fff;border:1px solid #D5D9D2;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px">
<div style="font-size:18px;font-weight:600">Exam traps</div>
<sc-for list="{{L_traps}}" as="tp" hint-placeholder-count="3">
<div style="font-size:14px;line-height:1.45">{{tp.t}}</div>
</sc-for>
</div>
</div>
</div>

</div>
</div>
</div>
</sc-if>

<!-- Lesson heading -->
<sc-if value="{{isLesson}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#4B5563">{{stageKicker}}</div>
<h2 style="margin:0;font-size:28px;font-weight:600">{{stageTitle}}</h2>
<div style="font-size:16px;line-height:1.5;color:#17202A"><strong>Goal:</strong> {{stageGoal}}</div>
</div>
</sc-if>

<!-- STAGE 1 -->
<sc-if value="{{isS1}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:20px">
<div style="{{cardStyle}}">
<div style="font-size:16px;line-height:1.6">A <strong>diffraction grating</strong> is a plate with a huge number of very thin, equally spaced slits. A single beam of light passes through and spreads into a row of sharp bright spots on the screen.</div>
<div style="font-size:16px;line-height:1.6">The spot straight ahead is the <strong>central maximum</strong>, order <strong>n = 0</strong>. The others are numbered n = 1, 2, 3… on each side of the centre.</div>
</div>
<div style="{{cardStyle}}">
<div style="font-size:18px;font-weight:600">Try it: change the number of slits</div>
<div style="display:flex;flex-direction:column;gap:4px;max-width:420px">
<div style="display:flex;justify-content:space-between"><label for="n1" style="font-size:15px;font-weight:500">Number of slits lit, N</label><span style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500">{{N}}</span></div>
<input id="n1" type="range" min="2" max="20" step="1" value="{{N}}" onInput="{{onN}}" onChange="{{onN}}">
</div>
<div style="font-size:14px;color:#4B5563">Light: 600 nm · 300 lines per mm · screen 1.0 m away. The screen is shown ±80 cm wide.</div>
</div>
</div>
</sc-if>

<!-- STAGE: THE WHOLE PICTURE -->
<sc-if value="{{isSP}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:20px">
<div style="{{cardStyle}}">
<div style="font-size:16px;line-height:1.6">Here is the whole experiment. Light of <strong>one wavelength</strong> hits a grating. Each slit sends light out in every direction, and the waves add up to give bright spots <strong>only at certain angles</strong>. Move the sliders and look for what changes and what stays put.</div>
</div>
<div style="{{cardStyle}}">
<div style="font-size:18px;font-weight:600">Try it: change the experiment</div>
<div style="display:flex;gap:24px;flex-wrap:wrap">
<div style="flex:1 1 220px;display:flex;flex-direction:column;gap:4px">
<div style="display:flex;justify-content:space-between"><label for="wp" style="font-size:15px;font-weight:500">Wavelength λ</label><span style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500">{{lamLabel}}</span></div>
<div style="height:8px;border-radius:4px;background:{{lamCol}}"></div>
<input id="wp" type="range" min="400" max="700" step="1" value="{{lam}}" onInput="{{onLam}}" onChange="{{onLam}}">
</div>
<div style="flex:1 1 220px;display:flex;flex-direction:column;gap:4px">
<div style="display:flex;justify-content:space-between"><label for="lp" style="font-size:15px;font-weight:500">Lines per mm</label><span style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500">{{linesLabel}}</span></div>
<input id="lp" type="range" min="200" max="600" step="20" value="{{lines}}" onInput="{{onLines}}" onChange="{{onLines}}">
</div>
<div style="flex:1 1 220px;display:flex;flex-direction:column;gap:4px">
<div style="display:flex;justify-content:space-between"><label for="dp" style="font-size:15px;font-weight:500">Screen distance</label><span style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500">{{DLab}}</span></div>
<input id="dp" type="range" min="0.5" max="3" step="0.1" value="{{Dval}}" onInput="{{onD}}" onChange="{{onD}}">
</div>
</div>
<div style="overflow-x:auto">
<div style="position:relative;width:100%;min-width:520px;max-width:640px;aspect-ratio:560 / 450;border-radius:8px;overflow:hidden;background:#0B1220">
<sc-for list="{{pic}}" as="pc" hint-placeholder-count="30">
<div style="{{pc.st}}">{{pc.t}}</div>
</sc-for>
</div>
</div>
<div style="font-size:13px;color:#4B5563">Top view, not to scale: the vertical direction is stretched.</div>
<div style="font-size:16px;font-weight:600">What you see on the screen</div>
<div style="display:flex;height:80px;background:#000;border-radius:6px;overflow:hidden">
<sc-for list="{{strips}}" as="s" hint-placeholder-count="30">
<div style="{{s.st}}"></div>
</sc-for>
</div>
<div style="position:relative;height:30px">
<sc-for list="{{marks}}" as="m" hint-placeholder-count="5">
<div style="{{m.st}}">{{m.t}}</div>
</sc-for>
</div>
<div style="display:flex;flex-direction:column;gap:4px;background:#17202A;color:#fff;border-radius:8px;padding:16px;font-family:'IBM Plex Mono',monospace;font-size:14px;line-height:1.6">
<sc-for list="{{picWork}}" as="pw" hint-placeholder-count="3">
<div>{{pw.t}}</div>
</sc-for>
</div>
</div>
<div style="{{cardStyle}}">
<div style="font-size:18px;font-weight:600">Think about these as you play</div>
<div style="font-size:14px;line-height:1.5;color:#4B5563">There is nothing to submit. Change one slider at a time and talk about your answers with a classmate or write them in your notes.</div>
<sc-for list="{{thinkQs}}" as="tq" hint-placeholder-count="5">
<div style="display:flex;gap:12px;align-items:baseline;border-top:1px solid #D5D9D2;padding-top:10px">
<div style="width:28px;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:500">{{tq.n}}</div>
<div style="font-size:16px;line-height:1.5">{{tq.t}}</div>
</div>
</sc-for>
</div>
</div>
</sc-if>

<!-- STAGE 2 -->
<sc-if value="{{isS2}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:20px">
<div style="{{cardStyle}}">
<div style="font-size:16px;line-height:1.6">A grating is labelled in <strong>lines per mm</strong> (really, slits per mm). The formula needs the <strong>spacing d between neighbouring slits, in metres</strong>.</div>
<div style="font-size:16px;line-height:1.6"><strong>Step 1.</strong> d = 1 ÷ (lines per mm), which gives d in <strong>mm</strong>.<br><strong>Step 2.</strong> Change mm to m: multiply by 10⁻³.</div>
</div>
<div style="{{cardStyle}}">
<div style="font-size:18px;font-weight:600">Try it: see what d looks like</div>
<div style="display:flex;flex-direction:column;gap:4px;max-width:420px">
<div style="display:flex;justify-content:space-between"><label for="l2" style="font-size:15px;font-weight:500">Lines per mm</label><span style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500">{{linesLabel}}</span></div>
<input id="l2" type="range" min="100" max="600" step="20" value="{{lines}}" onInput="{{onLines}}" onChange="{{onLines}}">
</div>
<div style="position:relative;height:130px;border-radius:8px;overflow:hidden;background:#0B1220">
<sc-for list="{{slits}}" as="sl" hint-placeholder-count="20">
<div style="{{sl.st}}"></div>
</sc-for>

<script>

(function () {
  var EVENTS = { onclick: 'click', oninput: 'input', onchange: 'change', onpointerdown: 'pointerdown', onpointermove: 'pointermove', onpointerup: 'pointerup', onpointercancel: 'pointercancel' };
  var VOID = { input: 1, br: 1, hr: 1, img: 1, meta: 1, link: 1 };
  var HOLE = /^\{\{\s*([^}\s]+)\s*\}\}$/;
  var HOLES = /\{\{\s*([^}\s]+)\s*\}\}/g;
  function get(scope, path) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (!isNaN(Number(path))) return Number(path);
    var v = scope, parts = path.split('.');
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }
  function interp(str, scope) { return str.replace(HOLES, function (m, p) { var v = get(scope, p); return v == null ? '' : String(v); }); }

  var handlers = {}, eid = 0;
  function renderNode(node, scope, out) {
    if (node.nodeType === 3) { out.push(esc(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.tagName.toLowerCase();
    var kids = function (sc) { for (var c = node.firstChild; c; c = c.nextSibling) renderNode(c, sc, out); };
    if (tag === 'sc-if') {
      var m = HOLE.exec(node.getAttribute('value') || '');
      if (m && get(scope, m[1])) kids(scope);
      return;
    }
    if (tag === 'sc-for') {
      var lm = HOLE.exec(node.getAttribute('list') || '');
      var list = (lm && get(scope, lm[1])) || [];
      var as = node.getAttribute('as');
      for (var i = 0; i < list.length; i++) {
        var sc = Object.create(scope); sc[as] = list[i]; sc.$index = i; kids(sc);
      }
      return;
    }
    var attrs = '', hmap = null;
    for (var a = 0; a < node.attributes.length; a++) {
      var at = node.attributes[a], name = at.name, val = at.value;
      if (name.indexOf('hint-') === 0 || name === 'data-props') continue;
      var hm = HOLE.exec(val);
      if (EVENTS[name]) {
        if (hm) { var fn = get(scope, hm[1]); if (typeof fn === 'function') { hmap = hmap || {}; hmap[name] = fn; } }
        continue;
      }
      if (hm) {
        var raw = get(scope, hm[1]);
        if (name.indexOf('aria-') === 0 || name.indexOf('data-') === 0) { attrs += ' ' + name + '="' + escAttr(String(raw)) + '"'; }
        else if (raw === false || raw == null) { /* omit */ }
        else if (raw === true) { attrs += ' ' + name + '=""'; }
        else { attrs += ' ' + name + '="' + escAttr(String(raw)) + '"'; }
      } else {
        attrs += ' ' + name + '="' + escAttr(interp(val, scope)) + '"';
      }
    }
    if (hmap) { var id = ++eid; handlers[id] = hmap; attrs += ' data-eid="' + id + '"'; }
    out.push('<' + tag + attrs + '>');
    if (!VOID[tag]) { kids(scope); out.push('</' + tag + '>'); }
  }

  function syncAttrs(o, n) {
    var i, name;
    for (i = o.attributes.length - 1; i >= 0; i--) { name = o.attributes[i].name; if (!n.hasAttribute(name)) o.removeAttribute(name); }
    for (i = 0; i < n.attributes.length; i++) {
      name = n.attributes[i].name;
      if (o.getAttribute(name) !== n.attributes[i].value) o.setAttribute(name, n.attributes[i].value);
    }
    if (o.tagName === 'INPUT') {
      var nv = n.getAttribute('value');
      if (nv != null && o.value !== nv) o.value = nv;
    }
  }
  function patchChildren(o, n) {
    var nk = Array.prototype.slice.call(n.childNodes), ok = Array.prototype.slice.call(o.childNodes), i;
    for (i = 0; i < nk.length; i++) {
      var a = nk[i], b = ok[i];
      if (!b) { o.appendChild(a); continue; }
      if (a.nodeType !== b.nodeType || (a.nodeType === 1 && a.tagName !== b.tagName)) { o.replaceChild(a, b); continue; }
      if (a.nodeType === 3) { if (b.nodeValue !== a.nodeValue) b.nodeValue = a.nodeValue; continue; }
      if (a.nodeType === 1) { syncAttrs(b, a); patchChildren(b, a); }
    }
    for (i = ok.length - 1; i >= nk.length; i--) o.removeChild(ok[i]);
  }

  window.mountDC = function (Cls, tplEl, root, props) {
    var comp = new Cls(props || {});
    var tpl = tplEl.content;
    comp._render = function () {
      handlers = {}; eid = 0;
      var out = [], scope = comp.renderVals();
      for (var c = tpl.firstChild; c; c = c.nextSibling) renderNode(c, scope, out);
      var tmp = document.createElement('div');
      tmp.innerHTML = out.join('');
      patchChildren(root, tmp);
    };
    Object.keys(EVENTS).forEach(function (k) {
      var type = EVENTS[k];
      root.addEventListener(type, function (ev) {
        var el = ev.target;
        while (el && el !== root) {
          var id = el.dataset && el.dataset.eid;
          if (id !== undefined && handlers[id] && handlers[id]['on' + type]) {
            var fn = handlers[id]['on' + type];
            fn({ type: ev.type, target: ev.target, currentTarget: el, clientX: ev.clientX, clientY: ev.clientY, pointerId: ev.pointerId, pointerType: ev.pointerType, buttons: ev.buttons, pressure: ev.pressure, nativeEvent: ev, preventDefault: function () { ev.preventDefault(); }, stopPropagation: function () { ev.stopPropagation(); } });
            return;
          }
          el = el.parentNode;
        }
      });
    });
    comp._render();
    return comp;
  };
})();


// ---- tiny template runtime (no dependencies) ----
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; this._q = false; }
  setState(patch) {
    Object.assign(this.state, patch);
    if (!this._q) { this._q = true; queueMicrotask(() => { this._q = false; this._render && this._render(); }); }
  }
  forceUpdate() { this.setState({}); }
}


class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { view: 'lesson', stage: 1, ptab: 'grating', ans: {}, hints: {}, sols: {}, N: 8, lines: 300, lam: 600, D: 1, n: 1, sym: null, dn: 1, tool: 'pen', color: 'k', finger: false, ink: {}, cur: null, pads: {}, lab: { mode: 'slit', lambda: 600, a: 0.5, lines: 300, D: 2, N: 8, order: 1 } };
  }

  // ---- handwriting helpers ----
  pathD(pts) {
    if (!pts || !pts.length) return '';
    const f = (v) => v.toFixed(1);
    if (pts.length === 1) return 'M' + f(pts[0][0]) + ' ' + f(pts[0][1]) + ' L' + f(pts[0][0] + 0.1) + ' ' + f(pts[0][1]);
    let d = 'M' + f(pts[0][0]) + ' ' + f(pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
      d += ' Q' + f(pts[i][0]) + ' ' + f(pts[i][1]) + ' ' + f(mx) + ' ' + f(my);
    }
    const l = pts[pts.length - 1];
    d += ' L' + f(l[0]) + ' ' + f(l[1]);
    return d;
  }
  penOk(e) {
    const t = e.pointerType || (e.nativeEvent && e.nativeEvent.pointerType) || 'mouse';
    return t !== 'touch' || this.state.finger;
  }
  padPoint(e) {
    const r = e.currentTarget.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }
  eraseAt(qid, pt) {
    const list = (this.state.ink[qid] || []);
    const keep = list.filter((sk) => !sk.pts.some((p) => Math.hypot(p[0] - pt[0], p[1] - pt[1]) < 14));
    if (keep.length !== list.length) this.setState({ ink: Object.assign({}, this.state.ink, { [qid]: keep }) });
  }

  sup(str) {
    const m = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
    return String(str).split('').map((c) => m[c] || c).join('');
  }
  sci(x, dig) {
    const n = dig || 3;
    let e = Math.floor(Math.log10(Math.abs(x)));
    let mant = x / Math.pow(10, e);
    if (Number(mant.toFixed(n - 1)) >= 10) { mant = mant / 10; e += 1; }
    return mant.toFixed(n - 1) + ' × 10' + this.sup(e);
  }
  rgb(l) {
    let r = 0, g = 0, b = 0;
    if (l < 440) { r = -(l - 440) / 60; b = 1; }
    else if (l < 490) { g = (l - 440) / 50; b = 1; }
    else if (l < 510) { g = 1; b = -(l - 510) / 20; }
    else if (l < 580) { r = (l - 510) / 70; g = 1; }
    else if (l < 645) { r = 1; g = -(l - 645) / 65; }
    else { r = 1; }
    const f = l < 420 ? 0.35 + 0.65 * (l - 380) / 40 : (l > 700 ? 0.35 + 0.65 * (780 - l) / 80 : 1);
    return [Math.min(1, r * f), Math.min(1, g * f), Math.min(1, b * f)];
  }

  bank() {
    const L3 = 'Level 3', L4 = 'Level 4', L5 = 'Level 5';
    return [
      // ---------- Lesson checks ----------
      { id: 'c1', set: 'st1', type: 'mc', text: 'You increase the number of slits N from 2 to 20. Everything else stays the same. What happens to the bright spots?',
        options: ['They move further apart.', 'They stay in the same places but become sharper and brighter.', 'They move closer together.', 'More bright spots appear.'], correct: 1,
        hint: 'Drag the slider and watch where the spot positions are, then how wide each one is.',
        sol: 'The positions depend on the slit spacing d and the wavelength, not on N.\nMore slits make each spot narrower and brighter.' },

      { id: 'c2a', set: 'st2', type: 'num', text: 'A grating has 500 lines per mm. Find the spacing d in µm.\n(1 µm = 10⁻⁶ m)', ans: 2.0, unit: 'µm',
        hint: 'd = 1 ÷ 500 mm. Then 1 mm = 1000 µm.',
        sol: 'd = 1 ÷ 500 mm = 0.00200 mm\n0.00200 mm × 1000 = 2.0 µm\n(= 2.0 × 10⁻⁶ m)' },
      { id: 'c2b', set: 'st2', type: 'num', text: 'A grating has 1200 lines per cm. Find d in µm.', ans: 8.33, unit: 'µm',
        hint: 'The label says per cm. d = 1 ÷ 1200 cm, and 1 cm = 10 000 µm.',
        sol: 'd = 1 ÷ 1200 cm = 8.33 × 10⁻⁴ cm\n1 cm = 10 000 µm, so d = 8.33 × 10⁻⁴ × 10 000 = 8.33 µm',
        traps: [[0.833, 'Check the unit: 1 cm is 10 000 µm, not 1000 µm.']] },
      { id: 'c2c', set: 'st2', type: 'num', text: 'A grating has slit spacing d = 1.60 µm. How many lines per mm does it have?', ans: 625, unit: 'lines per mm',
        hint: 'Change d to mm first (1 µm = 10⁻³ mm), then lines per mm = 1 ÷ d.',
        sol: 'd = 1.60 µm = 1.60 × 10⁻³ mm\nlines per mm = 1 ÷ (1.60 × 10⁻³) = 625' },

      { id: 'c3a', set: 'st3', type: 'mc', text: 'In d sin θ = nλ, the angle θ is measured between…',
        options: ['the straight-through direction (n = 0) and the direction of the nth bright spot.', 'the grating and the screen.', 'two neighbouring bright spots.', 'the incoming light and the surface of the grating.'], correct: 0,
        hint: 'Look at the symbol card: θ for n = 0 is zero.',
        sol: 'θ is the angle from the straight-through direction to the nth bright spot.\nFor the central spot n = 0, so θ = 0.' },
      { id: 'c3b', set: 'st3', type: 'mc', text: 'A problem gives lines per mm, the wavelength and the order n, and asks for the angle. Which rearrangement do you use?',
        options: ['sin θ = nλ ÷ d', 'sin θ = d ÷ (nλ)', 'sin θ = nλd', 'sin θ = λ ÷ (nd)'], correct: 0,
        hint: 'Divide both sides of d sin θ = nλ by d.',
        sol: 'd sin θ = nλ\nDivide both sides by d: sin θ = nλ ÷ d' },

      { id: 'k1a', set: 'st4', group: 'K1', type: 'num', text: 'Light of wavelength 589 nm falls normally on a grating with 500 lines per mm. The screen is 1.50 m from the grating.\n\n(a) Find the grating spacing d in µm.', ans: 2.0, unit: 'µm', tol: 0.02, fig: { n: 1, ang: 'θ₁ = ?', info: ['500 lines per mm', 'λ = 589 nm'], D: 'D = 1.50 m', y: 'y = ?' },
        hint: 'd = 1 ÷ 500 mm, and 1 mm = 1000 µm.', sol: 'd = (1 ÷ 500) mm = 2.00 × 10⁻³ mm\nd = 2.00 × 10⁻⁶ m = 2.0 µm' },
      { id: 'k1b', set: 'st4', group: 'K1', type: 'num', text: '(b) Find the angle θ of the 1st-order (n = 1) bright fringe.', ans: 17.13, unit: '°', tol: 0.015,
        hint: 'Use d sin θ = nλ with d in metres and λ = 589 × 10⁻⁹ m.', sol: 'sin θ = nλ ÷ d = (1)(5.89 × 10⁻⁷) ÷ (2.00 × 10⁻⁶) = 0.2945\nθ = sin⁻¹(0.2945) = 17.1°' },
      { id: 'k1c', set: 'st4', group: 'K1', type: 'num', text: '(c) Find the distance y on the screen between the central bright fringe and the 1st-order bright fringe, in metres.', ans: 0.462, unit: 'm', tol: 0.02,
        hint: 'Use the right-angled triangle: y = D tan θ. Keep θ unrounded on your calculator.', sol: 'y = D tan θ = (1.50) tan 17.13°\ny = 0.462 m', traps: [[0.4418, 'That is D sin θ. Use tan θ, because y and D are the two sides of the right-angled triangle.']] },
      { id: 'k2a', set: 'st4', group: 'K2', type: 'num', text: 'Light of wavelength 650 nm falls normally on a grating with 400 lines per mm. The screen is 1.00 m away. This time we look at the 2nd-order fringe.\n\n(a) Find the grating spacing d in µm.', ans: 2.5, unit: 'µm', tol: 0.02, fig: { n: 2, ang: 'θ₂ = ?', info: ['400 lines per mm', 'λ = 650 nm'], D: 'D = 1.00 m', y: 'y = ?' },
        hint: 'd = 1 ÷ 400 mm.', sol: 'd = (1 ÷ 400) mm = 2.50 × 10⁻³ mm\nd = 2.50 × 10⁻⁶ m = 2.5 µm' },
      { id: 'k2b', set: 'st4', group: 'K2', type: 'num', text: '(b) Find the angle θ of the 2nd-order (n = 2) bright fringe.', ans: 31.33, unit: '°', tol: 0.015,
        hint: 'Now n = 2. sin θ = nλ ÷ d.', sol: 'sin θ = (2)(6.50 × 10⁻⁷) ÷ (2.50 × 10⁻⁶) = 0.520\nθ = sin⁻¹(0.520) = 31.3°' },
      { id: 'k2c', set: 'st4', group: 'K2', type: 'num', text: '(c) Find the distance y on the screen between the central bright fringe and the 2nd-order bright fringe, in metres.', ans: 0.609, unit: 'm', tol: 0.02,
        hint: 'y = D tan θ. At this larger angle tan θ and sin θ are noticeably different.', sol: 'y = D tan θ = (1.00) tan 31.33°\ny = 0.609 m', traps: [[0.52, 'That is D sin θ. Use tan θ. At a large angle like this, sin θ and tan θ are quite different.']] },
      { id: 'c5a', set: 'st5', type: 'num', text: 'A grating has 300 lines per mm. Light of wavelength 600 nm is used. Find the highest order n_max.', ans: 5, unit: '', tol: 0.001,
        hint: 'd = 1 ÷ 300 mm = 3.33 µm. Work out d ÷ λ and round down.',
        sol: 'd = 3.33 × 10⁻⁶ m\nd ÷ λ = 3.33 × 10⁻⁶ ÷ 6.00 × 10⁻⁷ = 5.56\nn < 5.56, so n_max = 5' },
      { id: 'c5b', set: 'st5', type: 'num', text: 'For the same grating and light, how many bright spots appear on the screen in total, including the centre?', ans: 11, unit: '', tol: 0.001,
        hint: 'Spots on each side: 1 to n_max. Then add the centre.',
        sol: 'Total = 2n_max + 1 = 2(5) + 1 = 11' },
      { id: 'c5c', set: 'st5', type: 'mc', text: 'For a certain grating and light, d ÷ λ works out to exactly 4.00. What is n_max?',
        options: ['3', '4', '5', '8'], correct: 0,
        hint: 'The rule is n < d ÷ λ, strictly less than.',
        sol: 'n < 4.00, so n cannot be 4.\nThe n = 4 spot would sit at θ = 90°, so it is not seen. n_max = 3.' },

      // ---------- Stage 5 derivation (guided) ----------
      { id: 'dv1', set: 'derive', type: 'mc', title: 'Step 1: the biggest possible angle',
        text: 'As n increases, the bright spots move further from the centre. The largest angle possible is when the light would travel along the plane of the grating. What is that angle θ?',
        options: ['0°', '45°', '90°', '180°'], correct: 2, result: 'θ cannot reach beyond 90°',
        hint: 'θ is measured from the straight-through direction. The grating plate is at right angles to that direction.' },
      { id: 'dv2', set: 'derive', type: 'mc', title: 'Step 2: what this means for sin θ',
        text: 'sin 90° = 1. A bright spot at exactly 90° would run along the grating and never reach the screen. So for every bright spot we can see, sin θ must be ___ 1.',
        options: ['less than', 'greater than', 'exactly equal to', 'unrelated to'], correct: 0, result: 'sin θ < 1',

  evaluate(q, st) {
    // returns {status, fb}
    if (q.type === 'mc') {
      return st.sel === q.correct ? { status: 'correct', fb: 'Correct.' } : { status: 'wrong', fb: 'Not quite. Open the hint and try another option.' };
    }
    const raw = String(st.val === undefined ? '' : st.val).replace(/,/g, '').trim();
    const v = parseFloat(raw);
    if (!raw || isNaN(v)) return { status: 'invalid', fb: 'Type a number first, then press Check.' };
    const tol = q.tol === undefined ? 0.02 : q.tol;
    if (Math.abs(v - q.ans) <= tol * Math.abs(q.ans)) return { status: 'correct', fb: 'Correct.' };
    if (q.traps) {
      for (const t of q.traps) {
        if (Math.abs(v - t[0]) <= 0.02 * Math.abs(t[0])) return { status: 'wrong', fb: 'Not quite. ' + t[1] };
      }
    }
    return { status: 'wrong', fb: 'Not quite. Check your units, then open the hint.' };
  }

  strip(lamNm, lines, N, D, selN) {
    const half = 0.8;
    const lam = lamNm * 1e-9;
    const d = 1e-3 / lines;
    const c = this.rgb(lamNm);
    const S = 480;
    const strips = [], bars = [];
    const wpx = 2 * half / S;
    const inten = (x) => {
      const sinT = x / Math.sqrt(x * x + D * D);
      const phi = Math.PI * d * sinT / lam;
      const sp = Math.sin(phi);
      if (Math.abs(sp) < 1e-6) return 1;
      const v = Math.sin(N * phi) / (N * sp);
      return v * v;
    };
    for (let i = 0; i < S; i++) {
      const x = ((i + 0.5) / S * 2 - 1) * half;
      const I = (inten(x - wpx / 3) + inten(x) + inten(x + wpx / 3)) / 3;
      const v = Math.pow(I, 0.55);
      strips.push({ st: 'flex:1 1 0;background:rgb(' + Math.round(c[0] * 255 * v) + ',' + Math.round(c[1] * 255 * v) + ',' + Math.round(c[2] * 255 * v) + ')' });
      bars.push({ st: 'flex:1 1 0;height:' + (I * 100).toFixed(1) + '%;background:' + (this.props.accent ?? '#1D4ED8') });
    }
    const marks = [];
    let maxShown = 0;
    for (let n = 1; n < 80; n++) {
      const sn = n * lam / d;
      if (sn >= 1) break;
      if (D * Math.tan(Math.asin(sn)) > half) break;
      maxShown = n;
    }
    const stride = Math.max(1, Math.ceil(maxShown / 6));
    for (let n = -maxShown; n <= maxShown; n++) {
      if (n % stride !== 0 && Math.abs(n) !== selN) continue;
      const y = D * Math.tan(Math.asin(n * lam / d));
      const sel = Math.abs(n) === selN;
      marks.push({ st: 'position:absolute;left:' + ((y / half + 1) / 2 * 100).toFixed(2) + '%;top:0;transform:translateX(-50%);font-size:12px;line-height:16px;white-space:nowrap;border-top:2px solid ' + (sel ? '#17202A' : '#9AA3B0') + ';padding-top:4px;color:' + (sel ? '#17202A' : '#4B5563') + ';font-weight:' + (sel ? 600 : 400), t: 'n=' + String(n).replace('-', '−') });
    }
    return { strips: strips, bars: bars, marks: marks, maxShown: maxShown };
  }

  labVals(active) {
    const s = this.state.lab;
    const acc = this.props.accent ?? '#1D4ED8';
    const isSlit = s.mode === 'slit';
    const lam = s.lambda * 1e-9;
    const D = s.D;
    const d = isSlit ? s.a * 1e-3 : 1e-3 / s.lines;
    const dy = lam * D / d;
    const half = isSlit ? 0.010 : 0.8; // fixed physical screen window, so changing λ, a, D or d visibly moves the pattern
    const c = this.rgb(s.lambda);
    const col = 'rgb(' + Math.round(c[0] * 255) + ',' + Math.round(c[1] * 255) + ',' + Math.round(c[2] * 255) + ')';

    // orders on screen
    const orders = [];
    let maxShown = 0;
    for (let n = 1; n < 400; n++) {
      const sn = n * lam / d;
      if (sn >= 1) break;
      const y = D * Math.tan(Math.asin(sn));
      if (y > half * 1.0001) break;
      maxShown = n;
    }
    const nmax = Math.ceil(d / lam - 1e-9) - 1;
    const ord = Math.min(Math.max(1, s.order), Math.max(1, maxShown));

    for (let n = -maxShown; n <= maxShown; n++) {
      if (n % stride !== 0 && Math.abs(n) !== ord) continue;
      const sn = n * lam / d;
      const y = D * Math.tan(Math.asin(sn));
      orders.push({ n: n, y: y, sel: Math.abs(n) === ord });
    }

    // top-view geometry
    const Hx = Math.round(135 * D); // proportional to D, so the ray angles stay fixed when only D changes
    const ox = 70, oy = 225, Hh = 190;
    const wavefronts = [];
    const wsp = s.lambda / 20; // wavefront spacing shows λ
    for (let x = 10; x < 60; x += wsp) {
      wavefronts.push({ st: 'position:absolute;left:' + x.toFixed(1) + 'px;top:40px;width:2px;height:370px;background:' + col + ';opacity:.45' });
    }
    const gapOff = Math.round(s.a * 28); // slit separation drawn in proportion to a
    const gapUp = 'position:absolute;left:66px;top:' + (oy - gapOff - 3) + 'px;width:8px;height:6px;background:#0B1220';
    const gapDown = 'position:absolute;left:66px;top:' + (oy + gapOff - 3) + 'px;width:8px;height:6px;background:#0B1220';
    const period = 3000 / s.lines; // grating line spacing drawn in proportion to d
    const gGap = Math.max(2, Math.round(period * 0.4));
    const gratingStyle = 'position:absolute;left:66px;top:165px;width:8px;height:120px;background:repeating-linear-gradient(to bottom,#0B1220 0,#0B1220 ' + gGap + 'px,#6B7686 ' + gGap + 'px,#6B7686 ' + period.toFixed(1) + 'px)';
    const rays = [], dots = [], dotLabels = [];
    orders.forEach((o) => {
      const yv = o.y / half * Hh;
      const th = Math.atan2(yv, Hx);
      const L = Math.hypot(Hx, yv);
      const w = o.sel ? 3 : 2;
      rays.push({ st: 'position:absolute;left:' + ox + 'px;top:' + (oy - w / 2) + 'px;width:' + L.toFixed(1) + 'px;height:' + w + 'px;transform-origin:0 50%;transform:rotate(' + (-th).toFixed(4) + 'rad);background:' + (o.sel ? '#FFFFFF' : col) + ';opacity:' + (o.sel ? 1 : 0.6) });
      dots.push({ st: 'position:absolute;left:' + (ox + Hx - 6) + 'px;top:' + (oy - yv - 6).toFixed(1) + 'px;width:12px;height:12px;border-radius:50%;background:' + col + ';box-shadow:0 0 10px ' + col + ';' + (o.sel ? 'outline:2px solid #fff;' : '') });
      dotLabels.push({ st: 'position:absolute;left:' + (ox + Hx + 14) + 'px;top:' + (oy - yv - 9).toFixed(1) + 'px;font-size:13px;line-height:18px;color:' + (o.sel ? '#FFFFFF' : '#C9D1DC') + ';font-weight:' + (o.sel ? 600 : 400), t: o.n === 0 ? '0' : 'n=' + String(o.n).replace('-', '−') });
    });
    const sinSel = ord * lam / d;
    const thSel = Math.asin(sinSel);
    const ySel = D * Math.tan(thSel);
    const yvSel = ySel / half * Hh;
    const thv = Math.atan2(yvSel, Hx);
    const thetaLeft = ox + 80 * Math.cos(thv);
    const thetaTop = oy - 80 * Math.sin(thv) - 24;
    const thDeg = thSel * 180 / Math.PI;
    const thTxt = thDeg < 0.1 ? thDeg.toFixed(4) : (thDeg < 1 ? thDeg.toFixed(3) : thDeg.toFixed(1));

    // screen strip + intensity
    const S = active ? 600 : 1;
    const strips = [], bars = [];
    const wpx = 2 * half / S;
    const Nn = s.N;
    const inten = (x) => {
      const sinT = x / Math.sqrt(x * x + D * D);
      const phi = Math.PI * d * sinT / lam;
      if (isSlit) { const cc = Math.cos(phi); return cc * cc; }
      const sp = Math.sin(phi);
      if (Math.abs(sp) < 1e-6) return 1;
      const v = Math.sin(Nn * phi) / (Nn * sp);
      return v * v;
    };
    for (let i = 0; i < S; i++) {
      const x = ((i + 0.5) / S * 2 - 1) * half;
      const I = (inten(x - wpx / 3) + inten(x) + inten(x + wpx / 3)) / 3;
      const v = Math.pow(I, 0.55);

    }

      return { st: 'position:absolute;left:' + left.toFixed(2) + '%;top:0;transform:translateX(-50%);text-align:center;font-size:12px;line-height:16px;white-space:nowrap;border-top:2px solid ' + (o.sel ? '#17202A' : '#9AA3B0') + ';padding-top:4px;color:' + (o.sel ? '#17202A' : '#4B5563') + ';font-weight:' + (o.sel ? 600 : 400), t: lbl + (pos ? ' ' + pos : '') };
    });

    const lamNm = s.lambda;

      viewNote = 'Not to scale: vertical direction stretched';

        { k: 'Path difference for order n', v: ord + 'λ = ' + pd },
        { k: 'Angle θ to the order', v: thTxt + '°' },
        { k: 'Position y = nΔy', v: this.len(ord * dy) },
        { k: 'Fringe spacing Δy', v: this.len(dy) }
      ];
      formulaMain = 'Δy = λD / a';
      formulaNote = 'Two beams from S₁ and S₂ reinforce where the path difference is nλ. For small angles, a sin θ ≈ a·y/D, so neighbouring bright fringes are Δy = λD/a apart.';
      steps = [
        { t: 'λ = ' + lamNm + ' nm = ' + this.sci(lam) + ' m' },
        { t: 'a = ' + s.a.toFixed(2) + ' mm = ' + this.sci(d) + ' m' },
        { t: 'D = ' + D.toFixed(1) + ' m' },

        { t: '1. Double a. Predict Δy first, then drag the slider to check.' },

        { t: '3. Set D = 1.0 m, then 3.0 m. Show that Δy is proportional to D.' },
        { t: '4. Find settings that give Δy close to 3.0 mm.' }

      traps = [
        { t: '• Change mm and nm to metres before substituting.' },
        { t: '• Δy is the gap between neighbouring fringes. Centre to the nth fringe is nΔy.' },
        { t: '• Δy = λD/a needs a much smaller than D (small angles).' }
      ];
    } else {
      viewNote = 'Not to scale: vertical direction stretched';
      readout = [
        { k: 'Path difference for order n', v: ord + 'λ = ' + pd },
        { k: 'sin θ = nλ/d', v: sinSel.toFixed(3) },
        { k: 'Angle θ', v: thTxt + '°' },
        { k: 'Position y = D tan θ', v: this.len(ySel) },

      formulaNote = 'Light from every pair of neighbouring slits has path difference d sin θ. All the waves reinforce, giving a sharp bright spot, when d sin θ is a whole number of wavelengths.';
      steps = [
        { t: 'λ = ' + lamNm + ' nm = ' + this.sci(lam) + ' m' },
        { t: 'd = 1 ÷ (' + s.lines + ' × 10³ lines per m) = ' + this.sci(d) + ' m' },
        { t: 'n = ' + ord + ': sin θ = (' + ord + ')(' + this.sci(lam) + ') ÷ (' + this.sci(d) + ') = ' + sinSel.toFixed(3) },
        { t: 'θ = ' + thTxt + '°' },
        { t: 'n < d/λ = ' + (d / lam).toFixed(2) + ' → n_max = ' + nmax },
        { t: 'Bright spots in all = 2n_max + 1 = ' + (2 * nmax + 1) }
      ];

    }

    const tabBase = 'min-height:44px;padding:0 20px;border-radius:8px;font-size:16px;font-weight:500;border:1px solid #17202A;';
    const out = {
      isSlit: isSlit, isGrating: !isSlit,
      tabSlit: tabBase + (isSlit ? 'background:#17202A;color:#fff' : 'background:#fff;color:#17202A'),
      tabGrating: tabBase + (!isSlit ? 'background:#17202A;color:#fff' : 'background:#fff;color:#17202A'),
      setSlit: () => this.setLab({ mode: 'slit', D: 2, order: 1 }),

      halfLabel: this.len(half).replace('-', ''),
      formulaMain: formulaMain, formulaNote: formulaNote, steps: steps, tasks: tasks, traps: traps
    };
    const o2 = {};
    Object.keys(out).forEach((k) => { o2['L_' + k] = out[k]; });
    return o2;
  }

  renderVals() {
    const s = this.state;
    const acc = this.props.accent ?? '#1D4ED8';
    const isLesson = s.view === 'lesson';
    const isSim = s.view === 'sim';
    const isPractice = s.view === 'practice';

    const stageDone = (k) => bank.filter((q) => q.set === stageSets[k - 1] || (k === 6 && q.set === 'derive')).every((q) => (s.ans[q.id] || {}).status === 'correct');

    // questions in view

      // handwriting pad (practice only)
      const strokes = s.ink[q.id] || [];
      const cur = s.cur && s.cur.qid === q.id ? s.cur : null;
      const group = (c) => {
        let d = strokes.filter((sk) => sk.c === c).map((sk) => this.pathD(sk.pts)).join(' ');

      };
      const swatch = (c, hex) => 'width:44px;height:44px;border-radius:50%;background:' + hex + ';border:' + (s.color === c && s.tool === 'pen' ? '4px solid #fff;box-shadow:0 0 0 2px #17202A' : '2px solid #fff;box-shadow:0 0 0 1px #9AA3B0') + ';padding:0';
      const toolSt = (on) => 'min-height:44px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:500;border:1px solid #17202A;' + (on ? 'background:#17202A;color:#fff' : 'background:#fff;color:#17202A');
      const pad = {
        padAllowed: isPractice,

        pDown: (e) => {

    const dsteps = dq.map((q, idx) => {

      const letters = ['A', 'B', 'C', 'D'];
      const options = q.options.map((txt, i) => {

        return { label: letters[i] + '.  ' + txt, pick: () => {

        }, st: 'text-align:left;min-height:44px;padding:8px 14px;border-radius:8px;font-size:15px;line-height:1.4;color:#17202A;border:' + (chosen ? 2 : 1) + 'px solid ' + bd + ';background:' + bg };
      });

      };
    });
    const derivedAll = dq.every((q) => (s.ans[q.id] || {}).status === 'correct');

    // nav
    const done = stageDone(pos);
    const last = pos === 6;
    const nextLabel = last ? 'Go to practice' : 'Next stage';
    const navNote = pos === 2 ? 'Explore freely, then move on when you are ready.' : (done ? 'Stage complete.' : 'You can move on at any time and come back to the open questions later.');

    // practice report
    const pl = bank.filter((q) => q.set === s.ptab);
    let totalCorrect = 0;
    pl.forEach((q) => { if ((s.ans[q.id] || {}).status === 'correct') totalCorrect++; });
    const report = this.skillInfo(s.ptab).map((sk) => {
      const items = pl.filter((q) => q.skill === sk.key);
      const att = items.filter((q) => (s.ans[q.id] || {}).status).length;
      const cor = items.filter((q) => (s.ans[q.id] || {}).status === 'correct').length;
      const frac = items.length ? cor / items.length : 0;

        go: () => this.setState({ view: 'lesson', stage: sk.stage || 1 })

    });
    const pTabs = [['grating', 'Diffraction grating'], ['slit', 'Double slit'], ['mixed', 'Which formula?']];
    const ptabs = pTabs.map((p) => ({

      go: () => this.setState({ ptab: p[0] }),
      st: 'min-height:44px;padding:0 18px;border-radius:8px;font-size:15px;font-weight:500;border:1px solid #17202A;' + (s.ptab === p[0] ? 'background:#17202A;color:#fff' : 'background:#fff;color:#17202A')
    }));

      ? 'd = 1 ÷ (lines per mm), then change mm to m. Total bright spots = 2n_max + 1.'
      : (s.ptab === 'slit'

    const learn = {

      slits: slits, dBarStyle: dBarStyle, dLabelStyle: dLabelStyle, dWorking: dWorking,

      dnPrevDisabled: dn <= 1, dnNextDisabled: dn >= 3,
      dsteps: dsteps, derivedAll: derivedAll,
      rearr: [
        { k: 'Find the angle', f: 'sin θ = nλ ÷ d', t: 'You know d (or lines per mm), λ and n. Finish with sin⁻¹.' },

      ],

      showSim: showSim, showSimControls: showSimControls,
      exFig: stage === 4 ? this.schematic({ n: 1, ang: 'θ₁ = ?', info: ['300 lines per mm', 'λ = 600 nm'], D: 'D = 2.00 m', y: 'y = ?' }) : [],
      exSteps: [
        { t: '(a)  d = (1 ÷ 300) mm = 3.33 × 10⁻³ mm\n     d = 3.33 × 10⁻⁶ m', m: '1A' },
        { t: '(b)  d sin θ = nλ, with n = 1:\n     sin θ = (1)(600 × 10⁻⁹) ÷ (3.33 × 10⁻⁶) = 0.180', m: '1M' },
        { t: '     θ = sin⁻¹(0.180) = 10.4°', m: '1A' },
        { t: '(c)  y = D tan θ = (2.00) tan 10.4°', m: '1M' },
        { t: '     y = 0.366 m', m: '1A' }
      ],
      hasQs: qs.length > 0,
      thinkQs: [
        { n: '1.', t: 'Move only the screen distance D. What changes: the direction of the rays, the length of the rays, or the spacing of the spots on the screen?' },
        { n: '2.', t: 'Switch the light from red to violet. Do the spots move towards the centre or away from it?' },
        { n: '3.', t: 'Increase the lines per mm. What happens to the distance d between neighbouring slits, and what happens to the spread of the spots?' },
        { n: '4.', t: 'Look at the first-order ray. Which line is the angle θ measured from?' },
        { n: '5.', t: 'Can you keep adding more spots forever? What seems to stop them?' },
        { n: '6.', t: 'Does the central spot (n = 0) ever move?' }
      ],
      pic: pic, picWork: picWork, onD: (e) => this.setState({ D: +e.target.value }), DLab: 'D = ' + s.D.toFixed(1) + ' m', Dval: s.D,
      simTitle: stage === 3 ? 'Try it: move the sliders and read the numbers' : 'Check your answers here',
      strips: simVals.strips, bars: simVals.bars, marks: simVals.marks,
      nSel: nSel, simWork: simWork,
      prevN: () => this.setState({ n: Math.max(1, nSel - 1) }),
      nextN: () => this.setState({ n: Math.min(Math.max(1, simVals.maxShown), nSel + 1) }),
      prevDisabled: nSel <= 1, nextDisabled: nSel >= simVals.maxShown,
      ptabs: ptabs, pFormula: pFormula, pNote: pNote, pHasLab: s.ptab !== 'grating',
      qHeading: isLesson ? (stage === 4 ? 'Practice with variation: the same three steps' : 'Check yourself') : (s.ptab === 'grating' ? 'Diffraction grating practice' : (s.ptab === 'slit' ? 'Double slit practice' : 'Which formula?')),
      qs: qs,
      backStage: () => this.setState({ stage: Math.max(1, pos - 1) }),
      backDisabled: pos <= 1,
      nextStage: () => (last ? this.setState({ view: 'practice' }) : this.setState({ stage: pos + 1 })),
      nextStageDisabled: false,
      nextLabel: nextLabel, navNote: navNote,
      totalScore: totalCorrect + ' / ' + pl.length + ' correct',
      report: report,
      resetPractice: () => {
        const ids = {};
        pl.forEach((q) => { ids[q.id] = true; });
        const keep = (o) => { const n = {}; Object.keys(o).forEach((k) => { if (!ids[k]) n[k] = o[k]; }); return n; };
        this.setState({ ans: keep(s.ans), hints: keep(s.hints), sols: keep(s.sols), ink: keep(s.ink), cur: null });
      }
    };
    return Object.assign(learn, this.labVals(isSim));
  }
}

mountDC(Component, document.getElementById('tpl'), document.getElementById('app'), {});
</script>
